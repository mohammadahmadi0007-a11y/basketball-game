<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Basketball</title>
  <script src="https://tapi.bale.ai/miniapp.js?1"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1f2e;
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    }
    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 20, 34, 0.86);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
      color: #fff;
      text-align: center;
      padding: 18px;
      transition: opacity 0.2s ease;
      touch-action: manipulation;
    }
    .overlay.hidden {
      display: none !important;
      pointer-events: none;
    }
    .card {
      background: linear-gradient(145deg, #252d42, #1b2132);
      border: 2px solid rgba(255, 165, 0, 0.35);
      border-radius: 24px;
      padding: 22px 20px;
      width: 100%;
      max-width: 350px;
      max-height: 92vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 140, 0, 0.18);
      color: #ffb74d;
      border: 1px solid rgba(255, 140, 0, 0.4);
      padding: 4px 12px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #fff;
      letter-spacing: 0.5px;
    }
    p.desc {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 14px;
    }
    .rules-box {
      background: rgba(0, 0, 0, 0.28);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 16px;
      font-size: 12.5px;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .rules-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag-green {
      color: #4ade80;
      font-weight: 800;
      direction: ltr;
    }
    .tag-gold {
      color: #facc15;
      font-weight: 800;
      direction: ltr;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff7b00, #ff4d00);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(255, 94, 0, 0.4);
      margin-bottom: 10px;
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    .btn-secondary {
      padding: 11px 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.16);
    }
    .channel-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      color: #7dd3fc;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }
    .channel-id {
      direction: ltr;
      color: #fff;
      background: rgba(56, 189, 248, 0.25);
      padding: 3px 8px;
      border-radius: 8px;
      font-size: 12px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0 16px;
    }
    .stat-item {
      background: rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 8px;
    }
    .stat-label {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 24px;
      font-weight: 900;
      color: #ffb74d;
    }
    /* لیست ۲۰ نفر برتر */
    .lb-list {
      max-height: 280px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.28);
      border-radius: 14px;
      padding: 8px;
      margin: 12px 0 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 13px;
    }
    .lb-row.me {
      background: rgba(255, 140, 0, 0.22);
      border: 1px solid rgba(255, 165, 0, 0.5);
      font-weight: 800;
    }
    .lb-rank {
      width: 26px;
      text-align: center;
      font-weight: 900;
      color: #fbbf24;
    }
    .lb-name {
      flex: 1;
      text-align: right;
      padding: 0 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lb-score {
      font-weight: 900;
      color: #4ade80;
      direction: ltr;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      border: 1px solid #38bdf8;
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 700;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .toast.hidden {
      display: none;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <!-- منوی شروع -->
  <div id="startOverlay" class="overlay">
    <div class="card">
      <div class="badge">🏀 چالش ۲۵ ثانیه‌ای</div>
      <h1>Basketball</h1>
      <p class="desc">صفحه را بکشید، زاویه و قدرت پرتاب را تنظیم کنید و قبل از تمام شدن زمان، بیشترین امتیاز را بگیرید!</p>

      <div class="rules-box">
        <div class="rules-row">
          <span>گل معمولی:</span>
          <span class="tag-green">+3 SEC</span>
        </div>
        <div class="rules-row">
          <span>گل تمیز (بدون برخورد):</span>
          <span class="tag-gold">+6 SEC</span>
        </div>
        <div class="rules-row">
          <span>سطح سختی و وزش باد:</span>
          <span>سطح ۱ تا ۳</span>
        </div>
      </div>

      <button id="startBtn" type="button" class="btn-primary">شروع بازی 🏀</button>

      <div class="menu-grid">
        <button id="openLeaderboardBtn" type="button" class="btn-secondary">🏆 ۲۰ نفر برتر</button>
        <button id="shareStartBtn" type="button" class="btn-secondary">📤 ارسال به دوستم</button>
      </div>

      <a id="channelLink" href="https://ble.ir/YOUR_CHANNEL_ID" target="_blank" class="channel-box">
        <span>📢 عضویت در کانال ما:</span>
        <span id="channelIdText" class="channel-id">@YOUR_CHANNEL_ID</span>
      </a>
    </div>
  </div>

  <!-- منوی پایان بازی -->
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="card">
      <div class="badge">⏱ وقت تمام شد!</div>
      <h1>پایان بازی</h1>
      <div class="stats
